name: Deploy to S3 / CloudFront

on:
  push:
    branches: [main]

# One deploy at a time; newer pushes cancel older in-progress runs (batch to latest)
concurrency:
  group: peak-website-deploy
  cancel-in-progress: true

# Self-hosted Ubuntu — no GitHub-hosted minutes
jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      #- uses: actions/setup-node@v4
      #  with:
      #    node-version: 20
      #    cache: npm

      - name: Install
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Sync to S3
        env:
          AWS_DEFAULT_REGION: ap-south-1
        run: |
          set -euo pipefail
          aws s3 sync dist/ s3://peaklife-website-ap-south-1/ --delete --region ap-south-1
          aws cloudfront create-invalidation \
            --distribution-id E3JRZB3NUFKIKH \
            --paths "/*" \
