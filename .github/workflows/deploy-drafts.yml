name: Deploy drafts preview (S3 website)

on:
  push:
    branches: [drafts]

# Parallel to main → CloudFront prod. Preview uses S3 website hosting only.
concurrency:
  group: peak-website-drafts-deploy
  cancel-in-progress: true

jobs:
  deploy-drafts:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Sync to S3 website bucket
        env:
          AWS_DEFAULT_REGION: ap-south-1
          S3_DRAFTS_BUCKET: peaklife-website-drafts-ap-south-1
        run: |
          set -euo pipefail
          aws s3 sync dist/ "s3://${S3_DRAFTS_BUCKET}/" --delete --region ap-south-1
          echo "Drafts preview → http://${S3_DRAFTS_BUCKET}.s3-website.ap-south-1.amazonaws.com"
