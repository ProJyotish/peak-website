name: Deploy drafts preview (S3 / CloudFront)

on:
  push:
    branches: [drafts]

# Parallel to main → CloudFront prod. Staging uses S3 + CloudFront (HTTPS).
concurrency:
  group: peak-website-drafts-deploy
  cancel-in-progress: true

jobs:
  deploy-drafts:
    runs-on: self-hosted
    environment: staging
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_GTM_ID: ${{ vars.VITE_GTM_ID }}
          VITE_GA4_ID: ${{ vars.VITE_GA4_ID }}
          VITE_META_PIXEL_ID: ${{ vars.VITE_META_PIXEL_ID }}
          VITE_CLARITY_ID: ${{ vars.VITE_CLARITY_ID }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_REDDIT_PIXEL_ID: ${{ vars.VITE_REDDIT_PIXEL_ID }}
          VITE_RAZORPAY_KEY_ID: ${{ vars.VITE_RAZORPAY_KEY_ID }}
          VITE_WHATSAPP_NUMBER: ${{ vars.VITE_WHATSAPP_NUMBER }}
          VITE_WHATSAPP_URL: ${{ vars.VITE_WHATSAPP_URL }}
        run: npm run build

      - name: Sync to S3 / invalidate CloudFront
        env:
          AWS_DEFAULT_REGION: ap-south-1
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${S3_BUCKET:-}" ]]; then
            echo "Missing staging var S3_BUCKET" >&2
            exit 1
          fi
          if [[ -z "${CLOUDFRONT_DISTRIBUTION_ID:-}" ]]; then
            echo "Missing staging var CLOUDFRONT_DISTRIBUTION_ID (run scripts/aws/setup-drafts-cloudfront.sh)" >&2
            exit 1
          fi
          aws s3 sync dist/ "s3://${S3_BUCKET}/" --delete --region ap-south-1
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
          DOMAIN=$(aws cloudfront get-distribution \
            --id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --query 'Distribution.DomainName' \
            --output text)
          echo "Drafts preview → https://${DOMAIN}"
